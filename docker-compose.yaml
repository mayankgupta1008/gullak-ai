services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://backend:5001
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    ports:
      - "5001:5001"

  waha:
    image: devlikeapro/waha:gows-arm # arm64 tag; on x86 use devlikeapro/waha:gows
    env_file: .env # WAHA_API_KEY, WAHA_DASHBOARD_PASSWORD, WHATSAPP_SWAGGER_PASSWORD
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WHATSAPP_START_SESSION=default
      - WAHA_DASHBOARD_USERNAME=admin
      - WHATSAPP_SWAGGER_USERNAME=admin
    volumes:
      - waha-sessions:/app/.sessions
    ports:
      - "127.0.0.1:3000:3000" # localhost only: this port can read/send as the linked WhatsApp

volumes:
  waha-sessions:
